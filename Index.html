<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="estilo.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doa Petz Web</title>
</head>

<body>
    <header class="cabecalho">
        <nav class="menu">
            <img class="logomarca" src="./Assets/doapetz.png" alt="">

            <ul class="links-navegacao">
                <li>
                    <a href="">Entrar</a>
                </li>
                <li class="registrar">
                    <a href="">Cadastrar</a>
                </li>
            </ul>
        </nav>
    </header>
    <main class="corpo">
        <section class="painel-principal">
            <div class="anuncio-petz">
                <h1 class="titulo">Ajudando você a encontrar seu pet ideal!</h1>
                <p class="descricao">Nosso maior objetivo é ajudar a você a encontrar o pet que mais se encaixa com seu
                    perfil, e claro a ajudar nossos amiguinhos a encontrar o melhor lar possível.</p>
                <button class="botao-principal">Encontrar pet</button>
            </div>
             <div class="imagens-petz">
                <div class="fotos-da-esquerda">
                    <img src="./Assets/homem-cachorro.jpeg" alt="Homem com cachorro">
                    <img src="./Assets/moca-gatos.jpg" alt="Mulher com gatos">
                </div>
                <div class="fotos-da-direita">
                    <img src="./Assets/cachorro-oculos.jpg" alt="cachorro com oculos">
                </div>
            </div>
        </section>
    </main>
    <footer class="rodape">
        <div class="conteudo-rodape">
              <img class="logomarca" src="./Assets/doapetz-branco.png" alt="Logo DoaPetz">
        <div class="redes-sociais">
            <p class="descricao">Confira nossas redes sociais</p>
            <img class="icone-social" src="./Assets/facebook.png" alt="Facebook">
            <img class="icone-social" src="./Assets/instagram.png" alt="Instagram">
            <img class="icone-social" src="./Assets/whatsapp.png" alt="WhatsApp">
        </div>
        </div>
    </footer>
</body>

</html>
